[project]
name = "regulars-api"
version = "0.1.0"
description = "Backend API for the Regulars social app"
readme = "README.md"
authors = [
    { name = "Bryson Reese", email = "bryson@brysonreese.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
